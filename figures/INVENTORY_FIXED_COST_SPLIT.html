<figure class="editorial-figure">
<figcaption><span>FIGURE 01</span><strong>1,000개를 만들고, 800개를 팔았다</strong></figcaption>
<p style="font-size:15px;line-height:1.7;margin:0 0 16px">총제조원가 <strong>9,000만원</strong>은 제품이 팔렸는지에 따라 나뉜다.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px">
<div style="padding:22px;border:1px solid var(--line);background:#e9edf0">
<span style="display:block;font-size:15px">판매한 800개</span>
<strong style="display:block;font-size:28px;line-height:1.5;margin:8px 0">7,200만원</strong>
<span style="display:block;font-size:15px">이번 달 매출원가</span>
<p style="font-size:13px;line-height:1.7;margin:14px 0 0;color:var(--muted)">변동비 4,800 + 고정비 2,400</p>
</div>
<div style="padding:22px;border:1px solid var(--navy);background:var(--navy);color:#fff">
<span style="display:block;font-size:15px">남은 200개</span>
<strong style="display:block;font-size:28px;line-height:1.5;margin:8px 0">1,800만원</strong>
<span style="display:block;font-size:15px">기말 재고자산</span>
<p style="font-size:13px;line-height:1.7;margin:14px 0 0;color:#b7d2f7">변동비 1,200 + 고정비 600</p>
</div>
</div>
<p class="figure-note" style="margin-top:18px">재고에 남는 것은 미판매 제품 200개 몫이다. 그 안에 고정비 600만원도 포함돼 있다. 금액 단위: 만원.</p>
</figure>
