backend:
  name: github
  repo: yunjinea/hwang-yunjin-site
  branch: main

media_folder: "uploads"
public_folder: "/uploads"
publish_mode: simple

collections:
  - name: "writing"
    label: "Writing"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "발행일", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "카테고리"
        name: "category"
        widget: "select"
        options:
          - { label: "업무 / WORK", value: "work" }
          - { label: "투자 / INVESTING", value: "investing" }
          - { label: "개인 일상 / LIFE", value: "life" }
      - { label: "세부 라벨", name: "category_label", widget: "string" }
      - { label: "읽기 시간", name: "read_time", widget: "string", default: "5 MIN READ" }
      - { label: "요약", name: "excerpt", widget: "text" }
      - { label: "임시저장", name: "draft", widget: "boolean", default: false }
      - { label: "대표 이미지", name: "image", widget: "image", required: false }
      - { label: "본문", name: "body", widget: "markdown" }
